<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>목표 메이트</title>
    <link rel="stylesheet" href="mate.css" />
  </head>
  <body>
    <main class="stage" aria-label="오늘도 목표 메이트">
      <button class="bubble" id="bubble" type="button" aria-label="오늘도 열기">
        <strong id="bubbleHeading">오늘도 네 편이야 🌿</strong>
        <span id="message">오늘의 속도도 충분히 너다워.</span>
      </button>
      <button class="character" id="character" type="button" aria-label="목표 메이트와 대화하기">
        <img class="character-image" id="characterImage" src="assets/mate-cat-sign-3d.png" alt="" draggable="false" />
        <span class="status" aria-hidden="true"><small>오늘</small><span id="statusText">0/0</span></span>
      </button>
    </main>
    <script src="mate.js"></script>
  </body>
</html>
