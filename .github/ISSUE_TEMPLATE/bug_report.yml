name: 버그 제보
description: 오늘도를 사용하며 겪은 문제를 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        알려주셔서 고맙습니다. 작은 불편도 더 다정한 오늘도를 만드는 데 큰 도움이 됩니다.
  - type: textarea
    id: problem
    attributes:
      label: 무슨 문제가 있었나요?
      description: 어떤 행동을 했을 때 문제가 나타났는지 적어주세요.
      placeholder: 예) 설정에서 시간을 바꾼 후 창을 닫았더니…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 어떻게 동작하길 바랐나요?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 오늘도 버전
      placeholder: 예) 1.19.0
  - type: input
    id: macos
    attributes:
      label: macOS 버전
      placeholder: 예) macOS 26
  - type: textarea
    id: attachments
    attributes:
      label: 스크린샷이나 추가 설명
      description: 가능하면 문제가 보이는 화면을 첨부해 주세요.
